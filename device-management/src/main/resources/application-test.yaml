quarkus:
  datasource:
    db-kind: h2
    jdbc:
      driver: org.h2.Driver
      url: jdbc:h2:tcp://localhost/mem:test

  liquibase:
    change-log: liquibase/test-changeLog.xml
    contexts: "schema,test-schema,base-data,test-data"

  debezium-outbox:
    remove-after-insert: false

  log:
    category:
      "liquibase":
        level: ERROR
