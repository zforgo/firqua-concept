quarkus:
  rest:
    path: "/api"

  smallrye-openapi:
    info-title: ${quarkus.application.name}
    info-version: ${quarkus.application.version}

  datasource:
    db-kind: postgresql
    username: firqua
    password: firqua1234
    jdbc:
      url: jdbc:postgresql://localhost:65432/firqua

  hibernate-orm:
    mapping:
      id:
        optimizer:
          # noinspection QsYaml
          default: none

  liquibase:
    migrate-at-start: true
    change-log: liquibase/changeLog.xml
    database-change-log-table-name: '_LIQ_DATABASE_CHANGELOG'
    database-change-log-lock-table-name: '_LIQ_DATABASE_CHANGELOG_LOCK'
    contexts: "schema,base-data"

  log:
    category:
      "liquibase.util":
        # noinspection QsYaml
        level: WARN

