name: firqua-concept
services:
  device-manager-db:
    image: postgres:18-alpine
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf" ]
    ports:
      - "65432:5432"
    environment:
      POSTGRES_USER: firqua
      POSTGRES_PASSWORD: firqua1234
      POSTGRES_DB: firqua
    volumes:
      - device-manager-data:/var/lib/postgresql
      - ./postgresql/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
  device-simulator:
    build: ./device-simulator
    networks: [ device-sos-network, device-meteo-network ]
    volumes:
      - ./device-simulator/ranges.ini:/etc/device-simulator/conf/ranges.ini:ro
    cap_add: [ NET_ADMIN ]

networks:
  device-sos-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.56.0.0/16 # 172.56.0.1 - 172.56.255.255
          gateway: 172.56.0.1
          ip_range: 172.56.255.0/24
  device-meteo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.57.0.0/16 # 172.57.0.1 - 172.57.255.255
          gateway: 172.57.0.1
          ip_range: 172.57.255.0/24

volumes:
  device-manager-data:
