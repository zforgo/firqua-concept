# Load the file initdb generated in the existing cluster first
# (listen_addresses='*', shared_buffers, timezone, locale settings, ...).
# Later lines override earlier ones, so everything below wins.
include_if_exists = '/var/lib/postgresql/18/docker/postgresql.conf'

hba_file = '/etc/postgresql/pg_hba.conf'

#------------------------------------------------------------------------------
# Logical decoding for Debezium
#------------------------------------------------------------------------------
wal_level = logical               # requires restart
max_replication_slots = 10
max_wal_senders = 10
max_slot_wal_keep_size = 1GB      # caps WAL retained by a stalled slot
